# Named arm poses (degrees, LeRobot joint keys). `home` is real; the others are PLACEHOLDERS: capture them on the
# robot with `uv run python scripts/teleop.py`, key `p`, then paste them here and commit.
#
# home       : arm folded, out of the front camera's view. Pose while driving, start pose of
#              every demonstration, and carry pose. NEVER change it once data collection started.
#              It is the pose of the arm when the leader sits on its rest: scripts/record.py
#              measures it and prints the line to put here.
#              Set on 15 Nov from pick_sock_v1: the median first frame of its 59 episodes, and
#              the gripper as commanded on the rest (1.4 = closed). Closed is what we want:
#              going home keeps squeezing the object after a pick, and closes the hand again
#              after a drop, which is how every demonstration starts.
# pick_*     : open-loop grasp at the canonical pre-grasp pose (fallback without policy).
# drop_path_* : the drop into the bin, robot docked 35 cm from the bin's face (docs/NAVIGATION.md,
#              demo arena). Recorded on the robot on 15 Nov evening: the arm guided by hand,
#              torque off, read 20 times a second; a waypoint every 7 degrees (scratch tool
#              path_to_poses.py, see docs/NAVIGATION.md). Up folded, over the bin, open, back, home.
