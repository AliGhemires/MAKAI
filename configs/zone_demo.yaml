# THE DEMO ARENA (docs/DECISIONS.md D30), traced in the console on 15 Nov at 19:56 by driving the
# robot around it; the run that followed found, approached and picked the can. A copy kept in git:
# the console reads configs/zone.yaml (not in git). Before the demo, on the demo laptop:
#     cp configs/zone_demo.yaml configs/zone.yaml        (PowerShell: Copy-Item, same arguments)
# Map frame: origin = the robot's centre at the start, x ahead, y to the left. The zone runs from
# the start line 1.04 m ahead, and 2.04 m to the LEFT of the robot: it starts at the back-right corner.
room:
  length_m: 1.04
  width_m: 2.04
  margin_m: 0.0
  y_offset_m: 1.02
# The two bins behind the start line, faces 35 cm behind it; the robot docks on the line, facing them.
stations:
  trash: {x: -0.35, y: 0.0, dock_x: -0.05, dock_y: 0.0}     # behind the start pose: cans, marked with the U; docks 5 cm closer (dropped 5 cm short, 16 Nov)
  clothing: {x: -0.35, y: 0.48, dock_x: -0.05, dock_y: 0.48}  # 48 cm to the left of it (driven there), faces in line; docks 5 cm closer (dropped 5 cm short, 15 Nov): socks
